name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node (JS specs)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Convention checks
        run: bash scripts/check-conventions.sh

      # No --no-build: stale test DLLs hide compile errors from signature changes.
      - name: Test core
        run: dotnet test src/EditorPowertools.Tests/EditorPowertools.Tests.csproj -c Release

      - name: Test Forms add-on
        run: dotnet test src/EditorPowertools.Tests.Forms/EditorPowertools.Tests.Forms.csproj -c Release

      - name: Test Graph add-on
        run: dotnet test src/EditorPowertools.Tests.Graph/EditorPowertools.Tests.Graph.csproj -c Release

      # Sample sites are not packed, but they catch package-version conflicts between our
      # dependency ranges and real CMS/Graph/Forms package sets.
      - name: Build sample sites
        run: |
          dotnet build src/EditorPowertools.SampleSite/EditorPowertools.SampleSite.csproj -c Release
          dotnet build src/EditorPowertools.SampleSiteCms13/EditorPowertools.SampleSiteCms13.csproj -c Release

      # CMS 12 is supported on .NET 10 through our net8.0 build rolling forward (the .Cms12 packages).
      - name: Test CMS 12 build on the .NET 10 runtime
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: |
          dotnet test src/EditorPowertools.Tests/EditorPowertools.Tests.csproj -c Release -f net8.0
          dotnet test src/EditorPowertools.Tests.Forms/EditorPowertools.Tests.Forms.csproj -c Release -f net8.0
          dotnet test src/EditorPowertools.Tests.Graph/EditorPowertools.Tests.Graph.csproj -c Release -f net8.0

      - name: Pack both flavors and install them into consumer sites
        run: |
          bash scripts/pack-all.sh "0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}" ./nupkg
          bash scripts/pack-smoke.sh ./nupkg "0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}"
